<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00843D">
  <title>myLUAS</title>
  <style>
    :root {
      --green: #00843D;
      --green-dark: #00632E;
      --green-soft: #E8F5EC;
      --yellow: #FFD200;
      --yellow-soft: #FFF6CC;
      --white: #FFFFFF;
      --ink: #12261A;
      --muted: #5B6B60;
      --red-line: #E4002B;
      --error: #B3261E;
      --error-soft: #FDECEA;
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--green-soft); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: var(--green);
      color: var(--white);
      padding: 18px 16px 22px;
      border-bottom: 6px solid var(--yellow);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;
    }
    .brand .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--yellow); color: var(--green-dark);
      display: grid; place-items: center; font-size: 1.4rem;
    }
    .brand span.luas { color: var(--yellow); }
    .stop-title {
      margin-top: 14px; font-size: 1.35rem; font-weight: 700; line-height: 1.2;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* Stop picker */
    .picker label {
      display: block; font-weight: 700; font-size: 0.9rem;
      color: var(--green-dark); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .select-wrap { position: relative; }
    select {
      width: 100%;
      appearance: none; -webkit-appearance: none;
      font: inherit; font-size: 1.15rem; font-weight: 600;
      padding: 14px 48px 14px 16px;
      border: 3px solid var(--green);
      border-radius: var(--radius);
      background: var(--white); color: var(--ink);
      cursor: pointer;
    }
    select:focus { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .select-wrap::after {
      content: "▾"; position: absolute; right: 18px; top: 50%;
      transform: translateY(-50%); font-size: 1.3rem; color: var(--green);
      pointer-events: none;
    }

    /* Service message */
    .message {
      background: var(--yellow-soft);
      border-left: 6px solid var(--yellow);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem; line-height: 1.4;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .message .icon { font-size: 1.2rem; line-height: 1.2; }

    /* Error */
    .error {
      display: none;
      background: var(--error-soft);
      border-left: 6px solid var(--error);
      color: var(--error);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600; line-height: 1.4;
    }
    .error.show { display: block; }

    /* Direction cards */
    .directions { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(0, 80, 30, 0.08);
      overflow: hidden;
    }
    .card h2 {
      background: var(--green);
      color: var(--white);
      font-size: 1.1rem; font-weight: 800;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .card h2 .arrow { color: var(--yellow); }
    .tram {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-top: 1px solid #E3EDE6;
    }
    .tram:first-of-type { border-top: none; }
    .dest { font-size: 1.15rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .due {
      flex-shrink: 0;
      text-align: right;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .due .num { font-size: 2.6rem; font-weight: 800; color: var(--green-dark); }
    .due .unit { font-size: 0.95rem; font-weight: 700; color: var(--muted); margin-left: 4px; }
    .due.now {
      background: var(--yellow); color: var(--ink);
      font-size: 1.5rem; font-weight: 900;
      padding: 10px 16px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: 1px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) { .due.now { animation: none; } }
    .empty { padding: 16px; color: var(--muted); font-size: 1rem; }

    /* Status bar */
    .status {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
      font-size: 0.95rem; color: var(--muted);
    }
    .status strong { color: var(--ink); }
    .refresh-btn {
      font: inherit; font-weight: 700; font-size: 0.95rem;
      border: none; border-radius: 999px;
      background: var(--green); color: var(--white);
      padding: 10px 18px; cursor: pointer;
    }
    .refresh-btn:active { background: var(--green-dark); }
    .refresh-btn:focus-visible { outline: 4px solid var(--yellow); outline-offset: 2px; }
    .refresh-btn:disabled { opacity: 0.6; cursor: wait; }

    .loading { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 1.05rem; }

    footer {
      background: var(--green-dark);
      color: var(--white);
      text-align: center;
      font-size: 0.85rem; line-height: 1.5;
      padding: 16px;
      border-top: 4px solid var(--yellow);
    }

    @media (min-width: 640px) {
      .directions { flex-direction: row; }
      .directions .card { flex: 1; }
      main { max-width: 820px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">🚋</div>
      <div>my<span class="luas">LUAS</span></div>
    </div>
    <div class="stop-title" id="stopTitle">Loading…</div>
  </header>

  <main>
    <div class="picker">
      <label for="stopSelect">Your stop</label>
      <div class="select-wrap">
        <select id="stopSelect" aria-label="Choose your Luas stop">
          <option>Loading stops…</option>
        </select>
      </div>
    </div>

    <div class="error" id="error" role="alert"></div>

    <div class="message" id="message" hidden>
      <span class="icon" aria-hidden="true">ℹ️</span>
      <span id="messageText"></span>
    </div>

    <div class="directions" id="directions">
      <div class="loading">Fetching live trams…</div>
    </div>

    <div class="status">
      <span>Last updated: <strong id="updated">—</strong></span>
      <button class="refresh-btn" id="refreshBtn" type="button">↻ Refresh</button>
    </div>
  </main>

  <footer>
    Data: Transport Infrastructure Ireland. Built by James Anderson for BDAIB.
  </footer>

  <script>
    const API = "https://luas-class.kluxy.app";
    const STORAGE_KEY = "myluas.stop";
    const DEFAULT_STOP = "MYS";
    const REFRESH_MS = 20000;

    const els = {
      select: document.getElementById("stopSelect"),
      title: document.getElementById("stopTitle"),
      error: document.getElementById("error"),
      message: document.getElementById("message"),
      messageText: document.getElementById("messageText"),
      directions: document.getElementById("directions"),
      updated: document.getElementById("updated"),
      refreshBtn: document.getElementById("refreshBtn"),
    };

    let currentStop = loadStop();
    let timer = null;
    let requestId = 0;

    function loadStop() {
      try { return localStorage.getItem(STORAGE_KEY) || DEFAULT_STOP; }
      catch (e) { return DEFAULT_STOP; }
    }
    function saveStop(id) {
      try { localStorage.setItem(STORAGE_KEY, id); } catch (e) { /* storage blocked: ignore */ }
    }

    function showError(msg) {
      els.error.textContent = "⚠️ " + msg;
      els.error.classList.add("show");
    }
    function clearError() {
      els.error.textContent = "";
      els.error.classList.remove("show");
    }

    async function getJSON(url) {
      let res;
      try {
        res = await fetch(url, { cache: "no-store" });
      } catch (e) {
        throw new Error("Could not reach the Luas service. Check your internet connection.");
      }
      let data = null;
      try { data = await res.json(); } catch (e) { /* not JSON */ }
      if (!res.ok || (data && data.error)) {
        const msg = (data && (data.message || data.error)) || ("Server error " + res.status);
        throw new Error(msg);
      }
      if (!data) throw new Error("The server sent an unreadable response.");
      return data;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    async function loadStops() {
      const data = await getJSON(API + "/stops");
      const stops = Array.isArray(data.stops) ? data.stops : [];
      if (!stops.length) throw new Error("No stops were returned.");

      const groups = [
        { line: "red", label: "🔴 Red Line" },
        { line: "green", label: "🟢 Green Line" },
      ];
      els.select.innerHTML = "";
      for (const g of groups) {
        const og = document.createElement("optgroup");
        og.label = g.label;
        for (const s of stops.filter(s => s.line === g.line)) {
          const opt = el("option", null, s.name);
          opt.value = s.id;
          og.appendChild(opt);
        }
        if (og.children.length) els.select.appendChild(og);
      }

      // Fall back to default if the saved stop no longer exists
      if (!stops.some(s => s.id === currentStop)) currentStop = DEFAULT_STOP;
      els.select.value = currentStop;
    }

    function renderForecast(data) {
      els.title.textContent = data.stopName || currentStop;

      if (data.message) {
        els.messageText.textContent = data.message;
        els.message.hidden = false;
      } else {
        els.message.hidden = true;
      }

      els.directions.innerHTML = "";
      const dirs = Array.isArray(data.directions) ? data.directions : [];
      if (!dirs.length) {
        els.directions.appendChild(el("div", "card")).appendChild(
          el("div", "empty", "No tram information for this stop right now.")
        );
        return;
      }

      for (const dir of dirs) {
        const card = el("section", "card");
        const h2 = el("h2");
        const arrow = /out/i.test(dir.name) ? "→" : "←";
        h2.append(el("span", "arrow", arrow), document.createTextNode(dir.name || "Direction"));
        card.appendChild(h2);

        const trams = (Array.isArray(dir.trams) ? dir.trams : []).slice(0, 3);
        if (!trams.length) {
          card.appendChild(el("div", "empty", "No trams forecast."));
        }
        for (const t of trams) {
          const row = el("div", "tram");
          row.appendChild(el("div", "dest", t.destination || "—"));
          const mins = Number(t.due);
          let due;
          if (mins === 0) {
            due = el("div", "due now", "Due");
          } else {
            due = el("div", "due");
            due.append(el("span", "num", isNaN(mins) ? String(t.due) : String(mins)),
                       el("span", "unit", mins === 1 ? "min" : "mins"));
          }
          row.appendChild(due);
          card.appendChild(row);
        }
        els.directions.appendChild(card);
      }
    }

    async function refresh() {
      const myId = ++requestId;
      const stop = currentStop;
      els.refreshBtn.disabled = true;
      try {
        const data = await getJSON(API + "/forecast?stop=" + encodeURIComponent(stop));
        if (myId !== requestId) return; // a newer request replaced this one
        clearError();
        renderForecast(data);
        els.updated.textContent = new Date().toLocaleTimeString("en-IE", {
          hour: "2-digit", minute: "2-digit", second: "2-digit",
        });
      } catch (e) {
        if (myId !== requestId) return;
        showError(e.message || "Something went wrong loading live trams.");
        if (els.directions.querySelector(".loading")) els.directions.innerHTML = "";
      } finally {
        if (myId === requestId) els.refreshBtn.disabled = false;
      }
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(refresh, REFRESH_MS);
    }

    els.select.addEventListener("change", () => {
      currentStop = els.select.value;
      saveStop(currentStop);
      els.title.textContent = els.select.options[els.select.selectedIndex].text;
      els.directions.innerHTML = '<div class="loading">Fetching live trams…</div>';
      els.message.hidden = true;
      refresh();
      startTimer();
    });

    els.refreshBtn.addEventListener("click", () => { refresh(); startTimer(); });

    // Refresh straight away when the user returns to the tab
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) { refresh(); startTimer(); }
    });

    (async function init() {
      try {
        await loadStops();
      } catch (e) {
        showError("Couldn't load the stop list: " + e.message);
        els.select.innerHTML = "";
        const opt = el("option", null, currentStop);
        opt.value = currentStop;
        els.select.appendChild(opt);
      }
      await refresh();
      startTimer();
    })();
  </script>
</body>
</html>
